<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — ระบบแจ้งซ่อมเครื่องจักร V11</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun','Segoe UI',sans-serif; background: linear-gradient(135deg,#1a1f36 0%,#2d3561 100%); min-height: 100vh; }
    .login-card { border: none; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    .login-icon { width: 60px; height: 60px; background: linear-gradient(135deg,#3b82f6,#6366f1); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
  <div style="width:400px; padding: 1rem;">
    <div class="card login-card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="login-icon">
            <i class="bi bi-tools text-white" style="font-size:1.6rem"></i>
          </div>
          <h5 class="fw-bold mb-0">ระบบแจ้งซ่อมเครื่องจักร</h5>
          <small class="text-muted">V11 — พารามณี Group</small>
        </div>

        <div id="alert-box" class="alert d-none mb-3"></div>

        <form id="login-form">
          <div class="mb-3">
            <label class="form-label fw-medium">ชื่อผู้ใช้</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person text-muted"></i></span>
              <input type="text" id="inp-username" class="form-control" placeholder="username" required autocomplete="username">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-medium">รหัสผ่าน</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" id="inp-password" class="form-control" placeholder="••••••••" required>
              <button class="btn btn-outline-secondary" type="button" id="btn-toggle-pwd">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary fw-medium" id="btn-login">
              <i class="bi bi-box-arrow-in-right me-1"></i>เข้าสู่ระบบ
            </button>
          </div>
        </form>
      </div>
    </div>
    <p class="text-center text-white-50 small mt-3">
      <i class="bi bi-shield-lock me-1"></i>ระบบนี้สำหรับเจ้าหน้าที่ที่ได้รับอนุญาตเท่านั้น
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script>
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'app.html';
    });

    function showAlert(msg, type = 'danger') {
      const el = document.getElementById('alert-box');
      el.className = `alert alert-${type}`;
      el.textContent = msg;
      el.classList.remove('d-none');
    }

    document.getElementById('btn-toggle-pwd').addEventListener('click', () => {
      const inp = document.getElementById('inp-password');
      const icon = document.querySelector('#btn-toggle-pwd i');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      icon.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>กำลังเข้าสู่ระบบ...';

      const username = document.getElementById('inp-username').value.trim().toLowerCase();
      const password = document.getElementById('inp-password').value;

      try {
        // Lookup email from username in public usernames collection
        const snap = await db.collection('usernames').doc(username).get();
        if (!snap.exists) {
          showAlert('ไม่พบชื่อผู้ใช้นี้ในระบบ');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>เข้าสู่ระบบ';
          return;
        }
        const email = snap.data().email;
        await auth.signInWithEmailAndPassword(email, password);
        // onAuthStateChanged will redirect to app.html
      } catch (err) {
        const msg = {
          'auth/wrong-password': 'รหัสผ่านไม่ถูกต้อง',
          'auth/too-many-requests': 'พยายามล็อกอินหลายครั้งเกินไป กรุณารอสักครู่',
          'auth/user-disabled': 'บัญชีนี้ถูกระงับการใช้งาน',
          'auth/invalid-credential': 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'
        }[err.code] || ('เกิดข้อผิดพลาด: ' + err.message);
        showAlert(msg);
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
